apiVersion: v1
kind: Service
metadata:
  name: workflow-classifier
  namespace: mcpcodeaway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: workflow-classifier
  ports:
    - name: http
      port: 8003
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-classifier
  namespace: mcpcodeaway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workflow-classifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workflow-classifier
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workflow-classifier
          image: registry.example.invalid/mcpcodeaway/workflow-classifier:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8003
          env:
            - name: GATEWAY_APP_ENV
              value: prod
            - name: CLASSIFIER_MODEL_DIR
              value: /app/models
            - name: GATEWAY_WORKFLOW_CLASSIFIER_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-runtime-secrets
                  key: workflow-classifier-secret
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workflow-classifier-deny-egress
  namespace: mcpcodeaway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: workflow-classifier
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - protocol: TCP
          port: 8003
  egress: []
