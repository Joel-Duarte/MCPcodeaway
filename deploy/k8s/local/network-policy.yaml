apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-restricted-traffic
  namespace: mcpcodeaway-k1
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcpcodeaway-k1
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: NotIn
                values: [postgres]
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcpcodeaway-k1
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcpcodeaway-k1
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mock-backends
      ports:
        - protocol: TCP
          port: 8001
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcpcodeaway-k1
          podSelector:
            matchLabels:
              app.kubernetes.io/name: workflow-classifier
      ports:
        - protocol: TCP
          port: 8003
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
