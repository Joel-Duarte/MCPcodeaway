apiVersion: v1
kind: Service
metadata:
  name: mock-backends
  namespace: mcpcodeaway-k1
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mock-backends
  ports:
    - name: http
      port: 8001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-backends
  namespace: mcpcodeaway-k1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-backends
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-backends
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock-backends
          image: mcpcodeaway-k1-fixture:k1
          imagePullPolicy: Never
          command: ["uvicorn", "examples.mock_backends:app", "--host", "0.0.0.0", "--port", "8001"]
          env:
            - name: MOCK_ENABLE_K1_TEST_CONTROLS
              value: "true"
          ports:
            - name: http
              containerPort: 8001
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
