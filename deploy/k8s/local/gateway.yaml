apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: mcpcodeaway-k1
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: mcpcodeaway-k1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: mcpcodeaway:k1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: gateway-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GATEWAY_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: postgres-dsn
            - name: GATEWAY_ADMIN_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: admin-session-secret
            - name: GATEWAY_PROVENANCE_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: provenance-signing-secret
            - name: GATEWAY_TASK_DEDUPE_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: task-dedupe-secret
            - name: GATEWAY_DEV_OIDC_PRIVATE_KEY_PATH
              value: /run/gateway-secrets/dev-oidc-private.pem
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /app/config/upstreams.k8s.yaml
              subPath: upstreams.k8s.yaml
              readOnly: true
            - name: dev-key
              mountPath: /run/gateway-secrets
              readOnly: true
            - name: postgres-ca
              mountPath: /run/postgres-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: gateway-config
        - name: dev-key
          secret:
            secretName: gateway-secrets
            defaultMode: 0440
            items:
              - key: dev-oidc-private.pem
                path: dev-oidc-private.pem
        - name: postgres-ca
          secret:
            secretName: postgres-ca
            optional: true
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
