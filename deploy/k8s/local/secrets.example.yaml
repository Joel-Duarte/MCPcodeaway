apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: mcpcodeaway-k1
type: Opaque
stringData:
  postgres-password: replace-locally
  postgres-dsn: postgresql://gateway:replace-locally@postgres:5432/mcpcodeaway?sslmode=disable
  admin-session-secret: replace-with-a-random-value
  provenance-signing-secret: replace-with-a-random-value
  task-dedupe-secret: replace-with-a-random-value
  dev-oidc-private.pem: replace-with-a-local-development-private-key
