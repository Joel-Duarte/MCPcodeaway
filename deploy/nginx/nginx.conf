# Multi-replica reverse proxy & load balancer template for Docker Compose deployments.
# Mounted at /etc/nginx/templates/default.conf.template in nginx:1.27-alpine so
# GATEWAY_UPSTREAM_HOST switches seamlessly between gateway-prod and gateway-scaled.
# Note: Production AWS/GCP/K8s deployments typically replace this container with
# AWS ALB, Cloud Load Balancer, Envoy Gateway, or Kubernetes Ingress.

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_mcp_session_id $mcp_route_hint {
    default "stateless";
    "~."    "stateful-session";
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 80;
    server_name _;

    client_max_body_size 16m;

    set $gateway_upstream "http://${GATEWAY_UPSTREAM_HOST}:${GATEWAY_UPSTREAM_PORT}";

    location / {
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;

        # Preserve host, client IP, correlation IDs, WebSocket upgrades, and MCP routing headers
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-MCP-Route-Mode $mcp_route_hint;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Required for Streamable HTTP SSE streams & long Code Mode executions
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
