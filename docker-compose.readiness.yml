services:
  redis:
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  mock-backends:
    ports: !override ["127.0.0.1:8081:8001"]
    volumes:
      - ${READINESS_DEV_OIDC_KEY_PATH:-./.readiness/dev-oidc-private.pem}:/run/readiness/dev-oidc-private.pem:ro
    environment:
      MOCK_OIDC_ISSUER: http://localhost:8081/oidc
      MOCK_OIDC_PRIVATE_KEY_PATH: /run/readiness/dev-oidc-private.pem
      MOCK_OIDC_CLIENT_ID: mcp-readiness
      MOCK_OIDC_REDIRECT_URI: http://localhost:8080/auth/admin/callback
      MOCK_OIDC_AUDIENCE: api://mcp-readiness
      MOCK_ENABLE_READINESS_FAILURE_CONTROLS: "true"
      MOCK_IDEMPOTENCY_API_KEY: readiness-mock-idempotency-key
      GATEWAY_TOKEN_ISSUER: http://localhost:8081/oidc
      GATEWAY_JWKS_URL: http://mock-backends:8001/oidc/jwks

  gateway-scaled:
    volumes:
      - ./deploy/readiness/upstreams.readiness.yaml:/app/config/upstreams.readiness.yaml:ro
      - ${READINESS_DEV_OIDC_KEY_PATH:-./.readiness/dev-oidc-private.pem}:/run/readiness/dev-oidc-private.pem:ro
    depends_on:
      mock-backends:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      sandbox-worker:
        condition: service_healthy
    environment:
      GATEWAY_PROFILE: staging
      GATEWAY_APP_ENV: uat
      GATEWAY_AUTH_MODE: oidc
      GATEWAY_TOKEN_EXCHANGE_DIALECT: dev_local
      GATEWAY_DEV_OIDC_PRIVATE_KEY_PATH: /run/readiness/dev-oidc-private.pem
      GATEWAY_PUBLIC_URL: http://localhost:8080
      GATEWAY_OIDC_ISSUER: http://localhost:8081/oidc
      GATEWAY_OIDC_JWKS_URI: http://mock-backends:8001/oidc/jwks
      GATEWAY_OIDC_AUDIENCE: api://mcp-readiness
      GATEWAY_OIDC_TOKEN_ENDPOINT: http://mock-backends:8001/oidc/token
      GATEWAY_OIDC_CLIENT_ID: mcp-readiness
      GATEWAY_ADMIN_OIDC_AUTHORIZATION_ENDPOINT: http://localhost:8081/oidc/authorize
      GATEWAY_ADMIN_OIDC_REDIRECT_URI: http://localhost:8080/auth/admin/callback
      GATEWAY_ADMIN_OIDC_SCOPES: openid mcp.admin
      GATEWAY_ADMIN_OIDC_API_SCOPE: mcp.admin
      GATEWAY_ALLOWED_TENANTS: '["tenant-acme-dev"]'
      GATEWAY_CLAIM_MAPPING: '{"tenant":"tid","roles":"roles","groups":"groups"}'
      GATEWAY_ADMIN_ROLES: '["gateway_admin"]'
      GATEWAY_VIEWER_ROLES: '["operator_viewer"]'
      GATEWAY_APPROVAL_ROLES: '["tool_approver"]'
      GATEWAY_METRICS_ROLES: '["gateway_admin","tool_approver"]'
      GATEWAY_RATE_LIMIT_PER_MINUTE: "6000"
      GATEWAY_REQUIRE_ADMIN_AUTH: "true"
      GATEWAY_METRICS_REQUIRE_AUTH: "true"
      GATEWAY_ADMIN_SESSION_SECRET: local-only-readiness-admin-session-key
      GATEWAY_PROVENANCE_SIGNING_SECRET: local-only-readiness-provenance-key
      GATEWAY_UPSTREAMS_CONFIG_PATH: config/upstreams.readiness.yaml
      MOCK_IDEMPOTENCY_API_KEY: readiness-mock-idempotency-key
    profiles: ["scaled"]
