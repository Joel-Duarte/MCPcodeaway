services:
  redis:
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  mock-backends:
    ports: !reset []

  readiness-keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-only-readiness
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./deploy/readiness/keycloak:/opt/keycloak/data/import:ro
    networks:
      - control_plane
    profiles: ["scaled"]

  gateway-scaled:
    depends_on:
      mock-backends:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      sandbox-worker:
        condition: service_healthy
      readiness-keycloak:
        condition: service_started
    environment:
      GATEWAY_PROFILE: staging
      GATEWAY_APP_ENV: uat
      GATEWAY_AUTH_MODE: oidc
      GATEWAY_PUBLIC_URL: http://localhost:8080
      GATEWAY_OIDC_ISSUER: http://localhost:8081/realms/mcp-readiness
      GATEWAY_OIDC_JWKS_URI: http://readiness-keycloak:8080/realms/mcp-readiness/protocol/openid-connect/certs
      GATEWAY_OIDC_AUDIENCE: api://mcp-readiness
      GATEWAY_OIDC_TOKEN_ENDPOINT: http://readiness-keycloak:8080/realms/mcp-readiness/protocol/openid-connect/token
      GATEWAY_OIDC_CLIENT_ID: mcp-readiness
      GATEWAY_ADMIN_OIDC_AUTHORIZATION_ENDPOINT: http://localhost:8081/realms/mcp-readiness/protocol/openid-connect/auth
      GATEWAY_ADMIN_OIDC_REDIRECT_URI: http://localhost:8080/auth/admin/callback
      GATEWAY_ADMIN_OIDC_SCOPES: openid
      GATEWAY_ADMIN_OIDC_API_SCOPE: gateway.access
      GATEWAY_ALLOWED_TENANTS: '["mcp-readiness"]'
      GATEWAY_CLAIM_MAPPING: '{"tenant":"tenant","roles":"roles","groups":"groups"}'
      GATEWAY_ADMIN_ROLES: '["gateway_admin"]'
      GATEWAY_VIEWER_ROLES: '["operator_viewer"]'
      GATEWAY_APPROVAL_ROLES: '["tool_approver"]'
      GATEWAY_METRICS_ROLES: '["gateway_admin","tool_approver"]'
      GATEWAY_RATE_LIMIT_PER_MINUTE: "6000"
      GATEWAY_REQUIRE_ADMIN_AUTH: "true"
      GATEWAY_METRICS_REQUIRE_AUTH: "true"
      GATEWAY_ADMIN_SESSION_SECRET: local-only-readiness-admin-session-key
      GATEWAY_PROVENANCE_SIGNING_SECRET: local-only-readiness-provenance-key
      GATEWAY_UPSTREAMS_CONFIG_PATH: config/upstreams.readiness.yaml
    profiles: ["scaled"]
