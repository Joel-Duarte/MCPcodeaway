    downstream_scope: billing.read
    allowed_roles: [finance_analyst, billing_reader, readonly_auditor, admin]
    allowed_groups: [finance, audit, platform]
    allowed_scopes: [mcp.tools, finance.read]
    allowed_operations: [list_eu_invoices, get_eu_customer]
    tool_effects: { list_eu_invoices: read, get_eu_customer: read }
    tool_guidance:
      list_eu_invoices: { description: "Read EU invoice records with optional filters.", parameter_hints: { status: "Optional status, such as overdue or paid.", dataset: "Use standard for seeded examples; bulk is for volume checks." } }
      get_eu_customer: { description: "Read one seeded EU customer record.", parameter_hints: { customer_id: "EU customer ID, for example CUST-1003." } }
    tool_approval_policies:
      list_eu_invoices: { mode: none, version: 1 }
      get_eu_customer: { mode: none, version: 1 }
    mutating_tools: []
    enabled: true

