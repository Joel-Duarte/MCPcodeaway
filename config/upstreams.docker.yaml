  - name: ops_ticketing
    type: mcp_http
    url: http://mock-backends:8001/ops/mcp
    auth_type: delegated_token
    downstream_audience: api://ops-ticketing
    downstream_scope: ops.tickets
    allowed_roles: [ops_engineer, ticketing_writer, support_agent, admin]
    allowed_groups: [operations, support, platform]
    allowed_scopes: [mcp.tools, ops.read, ops.write]
    allowed_operations: [list_terminal_incidents, get_terminal_health, create_collection_case, search_sentry_errors, get_github_release_commit]
    tool_effects: { list_terminal_incidents: read, get_terminal_health: read, create_collection_case: high_impact, search_sentry_errors: read, get_github_release_commit: read }
    tool_guidance:
      list_terminal_incidents: { description: "Read terminal incidents across the seeded EU and US fleet.", parameter_hints: { status: "Optional status, such as open or resolved." } }
      get_terminal_health: { description: "Read current health and active incident data for one terminal.", parameter_hints: { terminal_id: "Terminal identifier, for example TERM-EU-44." } }
      create_collection_case: { description: "Request creation of a collections case; an operations manager must approve it.", parameter_hints: { customer_id: "Customer for the proposed case.", reason: "Brief business reason for the case.", priority: "Optional priority; defaults to high." } }
      search_sentry_errors: { description: "Read the seeded Sentry event and release SHA for a terminal.", parameter_hints: { terminal_id: "Terminal associated with the incident." } }
      get_github_release_commit: { description: "Read pull-request and repository metadata for a release commit.", parameter_hints: { release_sha: "Release SHA returned by search_sentry_errors." } }
    tool_approval_policies:
      list_terminal_incidents: { mode: none, version: 1 }
      get_terminal_health: { mode: none, version: 1 }
      create_collection_case: { mode: manager_approval, version: 1, confirmation_message: "Approve creation of this outbound collections case.", approver_groups: [operations-approvers] }
      search_sentry_errors: { mode: none, version: 1 }
      get_github_release_commit: { mode: none, version: 1 }
    mutating_tools: [create_collection_case]
    enabled: true

  - name: recovery_workbench
    demo_only: true
    type: mcp_http
    url: http://mock-backends:8001/recovery/mcp
    auth_type: none
    allowed_roles: [gateway_admin]
    allowed_groups: [platform-admins]
    allowed_scopes: [mcp.tools, mcp.write]
    allowed_operations: [submit_change, get_change_status]
    tool_effects: { submit_change: write, get_change_status: read }
    tool_guidance:
      submit_change: { description: "Submit a mock change with a stable idempotency key; a lost response may enter recovery.", parameter_hints: { idempotency_key: "Stable caller-generated key reused for retries of this same operation.", resource_id: "Resource identifier, for example terminal/TERM-EU-44.", change: "Short description of the requested change.", delay_ms: "Optional simulated delay from 0 to 2000 milliseconds.", simulate_failure: "Optional fault: reject before commit.", simulate_lost_response: "Optional fault: commit then drop the response.", simulate_pending: "Optional fault: leave the operation pending for reconciliation." } }
      get_change_status: { description: "Read status for a submitted change using its idempotency key.", parameter_hints: { idempotency_key: "The same stable key supplied to submit_change." } }
    tool_approval_policies:
      submit_change: { mode: requester_confirmation, version: 1, confirmation_message: "Confirm submission of this mock change to the recovery workbench." }
      get_change_status: { mode: none, version: 1 }
    mutating_tools: [submit_change]
    tool_recovery_policies:
      submit_change:
        enabled: true
        idempotency_key_argument: idempotency_key
        synchronous_budget_seconds: 0.4
        max_attempts: 3
        max_recovery_age_seconds: 30
        upstream_key_retention_seconds: 60
        status_tool: get_change_status
        status_key_argument: idempotency_key
    request_timeout_seconds: 5
    enabled: true

