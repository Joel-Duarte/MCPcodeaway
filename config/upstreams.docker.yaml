upstreams:
  - name: snowflake_ledger
    type: mcp_http
    url: http://mock-backends:8001/snowflake/mcp
    auth_type: delegated_token
    downstream_audience: api://snowflake-ledger
    downstream_scope: snowflake.read
    allowed_roles: [finance_analyst, snowflake_reader, readonly_auditor, admin]
    allowed_groups: [finance, audit, platform]
    allowed_scopes: [mcp.tools, finance.read]
    allowed_operations: [query_debt_ledger, get_customer_balance, get_trial_balance_lines, compute_interest_penalty]
    tool_effects: { query_debt_ledger: read, get_customer_balance: read, get_trial_balance_lines: read, compute_interest_penalty: read }
    tool_guidance:
      query_debt_ledger: { description: "Read ledger balances for matching customers; use filters to keep results focused.", parameter_hints: { status: "Optional status, such as overdue or current.", region: "Optional region, such as EU or US.", dataset: "Use standard for examples; bulk returns more rows." } }
      get_customer_balance: { description: "Read one seeded customer's current balance and aging details.", parameter_hints: { customer_id: "Seeded customer ID, for example CUST-1003." } }
      get_trial_balance_lines: { description: "Read trial-balance lines for reconciliation.", parameter_hints: { only_variances: "Set true to return only non-zero variance lines." } }
      compute_interest_penalty: { description: "Estimate a late-payment penalty without changing ledger data.", parameter_hints: { customer_id: "Customer associated with the estimate.", principal: "Principal amount in the customer's currency.", days_past_due: "Number of overdue days.", annual_rate_pct: "Optional annual rate percentage; defaults to 18." } }
    tool_approval_policies:
      query_debt_ledger: { mode: none, version: 1 }
      get_customer_balance: { mode: none, version: 1 }
      get_trial_balance_lines: { mode: none, version: 1 }
      compute_interest_penalty: { mode: none, version: 1 }
    mutating_tools: []
    enabled: true

