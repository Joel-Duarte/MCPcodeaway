upstreams:
  - name: snowflake_ledger
    type: mcp_http
    url: http://127.0.0.1:8001/snowflake/mcp
    auth_type: delegated_token
    downstream_audience: api://snowflake-ledger
    downstream_scope: snowflake.read
    allowed_roles:
      - finance_analyst
      - snowflake_reader
      - readonly_auditor
      - admin
    allowed_groups:
      - finance
      - audit
      - platform
    allowed_scopes:
      - mcp.tools
      - finance.read
    allowed_operations: [query_debt_ledger, get_customer_balance, get_trial_balance_lines, compute_interest_penalty]
    tool_effects:
      query_debt_ledger: read
      get_customer_balance: read
      get_trial_balance_lines: read
      compute_interest_penalty: read
    mutating_tools: []
    enabled: true

  - name: billing_legacy_eu
    type: openapi
    url: http://127.0.0.1:8001/billing-eu
    openapi_spec_url: http://127.0.0.1:8001/billing-eu/openapi.json
    auth_type: delegated_token
    downstream_audience: api://billing-eu
    downstream_scope: billing.read
    allowed_roles:
      - finance_analyst
      - billing_reader
      - readonly_auditor
      - admin
    allowed_groups:
      - finance
      - audit
      - platform
    allowed_scopes:
      - mcp.tools
      - finance.read
    allowed_operations: [list_eu_invoices, get_eu_customer]
    tool_effects:
      list_eu_invoices: read
      get_eu_customer: read
    mutating_tools: []
    enabled: true

  - name: billing_legacy_us
    type: openapi
    url: http://127.0.0.1:8001/billing-us
    openapi_spec_url: http://127.0.0.1:8001/billing-us/openapi.json
    auth_type: delegated_token
    downstream_audience: api://billing-us
    downstream_scope: billing.read
    allowed_roles:
      - finance_analyst
      - billing_reader
      - readonly_auditor
      - admin
    allowed_groups:
      - finance
      - audit
      - platform
    allowed_scopes:
      - mcp.tools
      - finance.read
    allowed_operations: [list_us_invoices, get_us_customer]
    tool_effects:
      list_us_invoices: read
      get_us_customer: read
    mutating_tools: []
    enabled: true

  - name: ops_ticketing
    type: mcp_http
    url: http://127.0.0.1:8001/ops/mcp
    auth_type: delegated_token
    downstream_audience: api://ops-ticketing
    downstream_scope: ops.tickets
    allowed_roles:
      - ops_engineer
      - ticketing_writer
      - support_agent
      - admin
    allowed_groups:
      - operations
      - support
      - platform
    allowed_scopes:
      - mcp.tools
      - ops.read
      - ops.write
    allowed_operations: [list_terminal_incidents, get_terminal_health, create_collection_case, search_sentry_errors, get_github_release_commit]
    tool_effects:
      list_terminal_incidents: read
      get_terminal_health: read
      create_collection_case: high_impact
      search_sentry_errors: read
      get_github_release_commit: read
    mutating_tools: [create_collection_case]
    tool_approval_policies:
      create_collection_case:
        mode: manager_approval
        version: 1
        confirmation_message: Approve creation of this outbound collections case.
        approver_groups: [operations-approvers]
    enabled: true
