profiles:
  production:
    description: "Barebones production gateway: MCP, OIDC/OBO, metrics, read-only GitOps."
    app_env: prod
    auth_mode: oidc
    token_exchange_dialect: rfc8693
    require_admin_auth: true
    allow_dynamic_upstreams: false
    metrics_require_auth: true
    features:
      audit_api: true
      metrics: true
      admin_read: true
      admin_write: false
      approval_api: true
      dashboard_ui: false
      comparator: false
      benchmarks_api: false
      dev_auth: false

  staging:
    description: "Onboarding profile with admin writes and the dashboard enabled."
    extends: production
    app_env: uat
    auth_mode: oidc
    require_admin_auth: true
    allow_dynamic_upstreams: true
    features:
      admin_write: true
      dashboard_ui: true

  demo:
    description: "Local demo with development login, mock personas, and comparison tools."
    extends: staging
    app_env: sandbox
    auth_mode: dev
    token_exchange_dialect: dev_local
    require_admin_auth: false
    allow_dynamic_upstreams: true
    features:
      dev_auth: true
      comparator: true
      benchmarks_api: true

  finance_strict:
    description: "Production profile with Code Mode grounding and no admin endpoints."
    extends: production
    execution_mode: codemode
    require_tool_grounding: true
    features:
      admin_read: false
