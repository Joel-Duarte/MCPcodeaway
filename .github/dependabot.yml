version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions-deps:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 10
    groups:
      frontend-tooling:
        patterns:
          - "nuxt*"
          - "@nuxt/*"
          - "vite*"
          - "@vitejs/*"
          - "@ui-sdk/*"
          - "@playwright/*"
          - "esbuild"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 10
    groups:
      backend-core:
        patterns:
          - "uvicorn*"
          - "fastapi*"
          - "pydantic*"
          - "mcp*"
