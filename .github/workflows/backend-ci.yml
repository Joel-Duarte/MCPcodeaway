name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Preflight, Ruff & Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run agent preflight policy checks
        run: uv run python scripts/agent_preflight.py

      - name: Check Python formatting with Ruff
        run: uv run ruff format --check src examples benchmarks tests scripts

      - name: Lint Python sources and tests with Ruff
        run: uv run ruff check src examples benchmarks tests scripts

      - name: Run full backend test suite
        run: uv run pytest -v

  docker-targets:
    name: Multi-Target Docker Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build barebones gateway, sandbox-worker, and gateway-ui targets
        run: |
          docker build --target gateway -t mcpcodeaway:ci-gateway .
          docker build --target sandbox-worker -t mcpcodeaway:ci-worker .
          docker build --target gateway-ui -t mcpcodeaway:ci-ui .
