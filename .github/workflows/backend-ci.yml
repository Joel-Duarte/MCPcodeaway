name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Preflight, Ruff & Pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra postgres

      - name: Set up Node.js and build admin SPA for dashboard integration tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build static Nuxt SPA assets
        working-directory: web
        env:
          NUXT_TELEMETRY_DISABLED: "1"
        run: npm ci && npm run generate

      - name: Run agent preflight policy checks
        run: uv run python scripts/agent_preflight.py

      - name: Check Python formatting with Ruff
        run: uv run ruff format --check src examples benchmarks tests scripts

      - name: Lint Python sources and tests with Ruff
        run: uv run ruff check src examples benchmarks tests scripts

      - name: Run full backend test suite
        run: uv run pytest -v

  docker-targets:
    name: Multi-Target Docker Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build barebones gateway, sandbox-worker, and gateway-ui targets
        run: |
          docker build --target gateway -t mcpcodeaway:ci-gateway .
          docker build --target sandbox-worker -t mcpcodeaway:ci-worker .
          docker build --target gateway-ui -t mcpcodeaway:ci-ui .
          docker run --rm mcpcodeaway:ci-gateway sh -c 'test ! -e /app/config/upstreams.readiness.yaml && test ! -e /app/deploy/readiness'
