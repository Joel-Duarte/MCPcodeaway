name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Nuxt Build & SPA Asset Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Prepare Nuxt types and modules
        working-directory: web
        env:
          NUXT_TELEMETRY_DISABLED: "1"
        run: npx nuxt prepare

      - name: Run Vitest @ui-sdk/vue agent & confirm gating tests
        working-directory: web
        run: npm run test:unit

      - name: Build static Nuxt 4 + @ui-sdk/vue console
        working-directory: web
        env:
          NUXT_TELEMETRY_DISABLED: "1"
        run: npm run generate

      - name: Set up Python & uv for gateway SPA asset, Playwright E2E & Bombadil smoke
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d

      - name: Install backend & Playwright Chromium
        run: |
          uv sync --frozen --extra dev
          cd web && npx playwright install --with-deps chromium

      - name: Verify gateway serves /dashboard/ and all compiled _nuxt assets
        run: |
          uv run python - <<'PY'
          import asyncio, re, tempfile, httpx
          from pathlib import Path
          from gateway.config import GatewaySettings
          from gateway.server import create_gateway_app

          async def main():
              with tempfile.TemporaryDirectory() as tmpdir:
                  app = create_gateway_app(
                      settings=GatewaySettings(
                          profile="demo",
                          require_admin_auth=True,
                          sqlite_path=str(Path(tmpdir) / "spa_smoke.db"),
                      )
                  )
                  rt = app.state.runtime
                  await rt.startup()
                  try:
                      async with httpx.AsyncClient(transport=httpx.ASGITransport(app=app), base_url="http://gw") as c:
                          r = await c.get("/dashboard/")
                          assert r.status_code == 200
                          assets = sorted(set(re.findall(r'/dashboard/_nuxt/[^"]+', r.text)))
                          assert any(a.endswith(".css") for a in assets)
                          assert any(a.endswith(".js") for a in assets)
                          for a in assets:
                              ar = await c.get(a)
                              assert ar.status_code == 200, (a, ar.status_code)
                  finally:
                      await rt.shutdown()

          asyncio.run(main())
          PY

      - name: Start live mock-backends & gateway for E2E and Bombadil
        run: |
          nohup uv run uvicorn examples.mock_backends:app --host 127.0.0.1 --port 8001 >/tmp/ci_mock.log 2>&1 &
          echo "MOCK_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8001/health >/dev/null && break
            sleep 0.25
          done
          if ! curl -sf http://127.0.0.1:8001/health >/dev/null; then
            cat /tmp/ci_mock.log || true
            exit 1
          fi

          GATEWAY_PROFILE=demo GATEWAY_SQLITE_PATH=/tmp/ci_ui.db nohup uv run uvicorn gateway.server:app --host 127.0.0.1 --port 8000 >/tmp/ci_gw.log 2>&1 &
          echo "GW_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health | grep -q '"startup_warnings":\[\]' && break
            sleep 0.5
          done
          if ! curl -sf http://127.0.0.1:8000/health | grep -q '"startup_warnings":\[\]'; then
            curl -s http://127.0.0.1:8000/health || true
            cat /tmp/ci_gw.log || true
            exit 1
          fi

      - name: Run Playwright E2E tests against live gateway
        working-directory: web
        run: npm run test:e2e

      - name: Run Antithesis Bombadil UI fuzzer
        uses: antithesishq/bombadil-action@d4f3fa478dfd54605f544d2c0d5f0fcfdeeec893
        with:
          driver: browser
          origin: http://127.0.0.1:8000/dashboard/
          specification: ./web/tests/bombadil/spec.ts
          time-limit: 1m
          exit-on-violation: true
          output-path: bombadil-output

      - name: Stop live gateway & mock-backends
        if: always()
        run: kill "${GW_PID:-0}" "${MOCK_PID:-0}" 2>/dev/null || true
