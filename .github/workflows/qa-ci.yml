name: QA & Benchmarks CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-and-benchmarks:
    name: Golden Flows & Locked Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Execute Golden Dataset E2E flows & benchmark regression tests
        run: uv run pytest tests/test_golden_flows.py tests/test_benchmark_regression.py -v

      - name: Run locked offline benchmark threshold verification
        run: |
          uv run python benchmarks/run_benchmark.py \
            --output "${{ runner.temp }}/qa_benchmark_results.json" \
            --verify-thresholds | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload QA benchmark report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-benchmark-results-${{ github.run_id }}
          path: ${{ runner.temp }}/qa_benchmark_results.json
          retention-days: 14
