[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpcodeaway"
version = "0.1.0"
description = "Vendor-agnostic Code-Mode Universal MCP Gateway with OIDC/RFC 8693 delegation and Monty sandboxing"
readme = "README.md"
license = "MIT"
authors = [{ name = "Joel Duarte" }]
requires-python = ">=3.12"
keywords = [
    "mcp",
    "model-context-protocol",
    "gateway",
    "codemode",
    "oidc",
    "zero-trust",
    "openapi",
    "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mcp>=1.9",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pydantic-monty",
    "httpx>=0.28",
    "httpcore>=1.0.9,<2",
    "pyjwt[crypto]>=2.10",
    "jsonschema>=4.23",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
redis = ["redis>=5.2"]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.30"]
postgres = ["asyncpg>=0.30"]
s3 = ["boto3>=1.35"]
classifier = ["onnxruntime>=1.20", "tokenizers>=0.20", "numpy>=2.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[project.scripts]
gateway = "gateway.cli:main"

[project.urls]
Homepage = "https://github.com/Joel-Duarte/MCPcodeaway"
Repository = "https://github.com/Joel-Duarte/MCPcodeaway"
Issues = "https://github.com/Joel-Duarte/MCPcodeaway/issues"
Documentation = "https://github.com/Joel-Duarte/MCPcodeaway/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: local integration tests using in-process services or local infrastructure",
    "postgres: requires an isolated PostgreSQL instance and mcpcodeaway[postgres]",
    "tcp_tls: opt-in local TCP/TLS integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S105", "S106", "S113", "S307", "S324", "S501", "S506"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/*.py" = ["E402", "S105", "S106"]
"tests/*.py" = ["S105", "S106"]
"examples/*.py" = ["S105", "S106"]
"src/gateway/config.py" = ["S105"]
"src/gateway/dispatcher.py" = ["S105"]
"src/gateway/admin_auth.py" = ["S105"]
"src/gateway/auth.py" = ["S105", "S106"]
